name: Build Ghostgram APK

on:
  push:
    branches: [ ghostgram ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup submodules and create directories
        run: |
          # 1. media submodule (for core_settings.gradle)
          git clone https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          cd TMessagesProj_Modules/media
          git checkout 09b6c97c0d691c50cd4541e1573995d4066d6f5c
          cd ../..

          # 2. create media3 directory so Gradle project ':TMessagesProj_Modules:media3' is happy
          mkdir -p TMessagesProj_Modules/media3

          # 3. jlatexmath submodule (needed by settings.gradle)
          mkdir -p TMessagesProj/lib
          git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath

          echo "Directories verified:"
          ls -la TMessagesProj_Modules/
          ls -la TMessagesProj/lib/

      - name: Prepare API_KEYS
        run: |
          echo "APP_ID=28753335" > API_KEYS
          echo "APP_HASH=365e92f4e601d19bb8cf7100906aca7b" >> API_KEYS
          cp API_KEYS TMessagesProj/API_KEYS
          if [ -d "TMessagesProj_App" ]; then cp API_KEYS TMessagesProj_App/API_KEYS; fi

      - name: Download Prebuilt Native Libs
        run: |
          mkdir -p native_libs
          cd native_libs
          curl -L -A "Mozilla/5.0 (Android; Mobile)" -o official.apk "https://telegram.org/dl/android/apk"
          if [ ! -s official.apk ] || [ $(stat -c%s official.apk) -lt 10000000 ]; then
            echo "Error: official.apk download failed or too small!"
            exit 1
          fi
          unzip -q official.apk "lib/*"
          cd ..
          mkdir -p TMessagesProj/src/main/jniLibs
          cp -r native_libs/lib/* TMessagesProj/src/main/jniLibs/
          echo "Native libraries placed in jniLibs:"
          ls -la TMessagesProj/src/main/jniLibs/
          ls -la TMessagesProj/src/main/jniLibs/arm64-v8a/

      - name: Cleanly disable externalNativeBuild in build.gradle
        run: |
          python3 -c "
          import os

          def clean_strip(file_path):
              if not os.path.exists(file_path):
                  return
              with open(file_path, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              out = []
              skip_until_depth = None
              current_depth = 0
              for line in lines:
                  stripped = line.strip()
                  open_count = line.count('{')
                  close_count = line.count('}')
                  if 'externalNativeBuild {' in stripped or 'externalNativeBuild{' in stripped:
                      skip_until_depth = current_depth
                      current_depth += (open_count - close_count)
                      continue
                  if skip_until_depth is not None:
                      current_depth += (open_count - close_count)
                      if current_depth <= skip_until_depth:
                          skip_until_depth = None
                      continue
                  current_depth += (open_count - close_count)
                  out.append(line)
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.writelines(out)
              print('Clean stripped:', file_path)

          for f in ['TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'build.gradle']:
              clean_strip(f)
          "

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload Ghostgram APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-Android-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
